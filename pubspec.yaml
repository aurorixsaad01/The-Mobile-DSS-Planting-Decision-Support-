name: ai_gardener
description: "A minimal, gamified AI gardening companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # AI Integration (Groq via OpenAI compatible package)
  dart_openai: ^5.1.0

  # Camera
  camera: ^0.11.0

  # Core Features
  geolocator: ^14.0.2
  http: ^1.1.2
  image_picker: ^1.0.7
  speech_to_text: ^7.4.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  light: ^5.0.0 

  # UI & Gamification
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true